<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geldjacht docent</title>
<style>
:root{--bg:#14213d;--ink:#1d2433;--line:#d9dee8}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.4 -apple-system,system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{color:#fff}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:16px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.plek{border-radius:14px;padding:16px;text-align:center;font-weight:700;background:#eef1f6}
.plek b{display:block;font-size:40px}
.p1{background:#ffd166}.p2{background:#e5e5e5}.p3{background:#f4a261}
table{width:100%;border-collapse:collapse}
th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}
button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;background:var(--ink);color:#fff;cursor:pointer}
.klein{font-size:14px;color:#5b6475}
@media(max-width:600px){.podium{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<h1>🏆 Geldjacht: docent</h1>
<p><a href="bord.html" target="_blank" style="color:#ffd166;font-weight:700">📺 Scorebord voor op het digibord openen</a></p>
<div class="card"><h2 style="margin-top:0">Winnaars <span id="ronde" class="klein"></span></h2><div class="podium" id="podium"></div><div id="rest"></div></div>
<div class="card"><h2 style="margin-top:0">Groepen</h2><table><thead><tr><th>Namen</th><th>Foto</th><th>Goed</th><th>Reken</th><th>Stukjes</th><th>Klaar</th></tr></thead><tbody id="groepen"></tbody></table>
<p class="klein">Ververst elke 10 seconden.</p></div>
<div class="card"><button id="nieuw">Nieuwe ronde starten (volgende klas)</button><p class="klein">Alle groepen beginnen dan opnieuw en de kaartjes zijn weer bruikbaar. Je hebt de pincode nodig.</p></div>
</main>
<script>
var SPEL="https://economie-h2-spel.nakijker-worker.workers.dev";
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function tijd(t){return t?new Date(t).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit",second:"2-digit"}):"";}
function laad(){
  fetch(SPEL).then(function(r){return r.json();}).then(function(d){
    document.getElementById("ronde").textContent="· ronde "+d.ronde;
    var w=d.winnaars;
    document.getElementById("podium").innerHTML=[0,1,2].map(function(i){var x=w[i];return '<div class="plek p'+(i+1)+'"><b>'+(i+1)+'</b>'+(x?esc(x.namen)+'<br><span class="klein">foto '+x.foto+' · '+tijd(x.t)+'</span>':'nog niemand')+'</div>';}).join("");
    document.getElementById("rest").innerHTML=w.slice(3).map(function(x,i){return '<p>'+(i+4)+'. '+esc(x.namen)+' <span class="klein">'+tijd(x.t)+'</span></p>';}).join("");
    d.groepen.sort(function(a,b){return (b.stukjes-a.stukjes)||(b.vragen-a.vragen);});
    document.getElementById("groepen").innerHTML=d.groepen.map(function(g){return '<tr><td>'+esc(g.namen)+'</td><td>'+g.foto+'</td><td>'+g.vragen+'</td><td>'+g.reken+'/3</td><td>'+g.stukjes+'</td><td>'+(g.klaar?"✅ "+tijd(g.klaar):"")+'</td></tr>';}).join("")||'<tr><td colspan="6">Nog geen groepen.</td></tr>';
  }).catch(function(){});
}
laad();setInterval(laad,10000);
document.getElementById("nieuw").onclick=function(){
  var p=prompt("Pincode docent:");if(!p)return;
  fetch(SPEL,{method:"POST",body:JSON.stringify({a:"ronde",pin:p})}).then(function(r){return r.json();}).then(function(r){alert(r.ok?"Nieuwe ronde "+r.ronde+" gestart.":r.fout);laad();});
};
</script>
</body></html>
